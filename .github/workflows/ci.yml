name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          enable-cache: false
      # Admission tests copy the selected interpreter into an isolated snapshot.
      - name: Sync locked dev dependencies and editable package without build isolation
        run: |
          uv sync --locked --no-install-project --extra dev --no-python-downloads --python "$(command -v python)"
          uv sync --locked --no-build-isolation --offline --extra dev --no-python-downloads --python "$(command -v python)"
      - run: .venv/bin/python -m ruff check src tests
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python -m build --no-isolation
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          .venv/bin/python -m venv "$RUNNER_TEMP/wheel-env"
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          test -f "${wheel[0]}"
          .venv/bin/python -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]).resolve(); print(f"ukrainian-llm-eval @ {p.as_uri()} --hash=sha256:{hashlib.sha256(p.read_bytes()).hexdigest()}")' "${wheel[0]}" > "$RUNNER_TEMP/wheel.req"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-index --no-deps --require-hashes -r "$RUNNER_TEMP/wheel.req"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -m ukrainian_llm_eval --help
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
  gec-scorer:
    name: GEC scorer build and parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build pinned scorer and verify provisioned resources
        run: |
          chmod -R go-rwx scorer
          docker build --platform linux/amd64 -t ukrainian-llm-eval-scorer:ci scorer
      - name: Check official parity and expected outcomes offline
        run: |
          python -m venv .venv
          .venv/bin/python scorer/check_parity.py --image ukrainian-llm-eval-scorer:ci --output .runtime/scorer-parity.json
          .venv/bin/python -m json.tool .runtime/scorer-parity.json
  security:
    # actionlint v1.7.12 rejects the newer $/ spelling. Both forms use this commit.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  gate:
    name: CI Gate
    if: always()
    needs: [test, codeql, gec-scorer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SCORER_RESULT: ${{ needs.gec-scorer.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$SCORER_RESULT" = success
          test "$SECURITY_RESULT" = success
