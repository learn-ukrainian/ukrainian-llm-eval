name: Security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Daily 03:37 UTC — surfaces newly-disclosed advisories between changes.
    - cron: '37 3 * * *'
permissions: {}
jobs:
  fleet-security:
    name: Fleet security
    uses: agentic-machinery/machinery/.github/workflows/fleet-security.yml@12f0ce5664024b1680ec9ffbfa1a2c6a4b078705 # machinery PR #1114
    permissions:
      contents: read
    with:
      run-actionlint: true
      run-zizmor: true
      run-secret-scan: true
      secret-scan-required-extensions: .py,.yml
      run-trivy-fs: true
      trivy-fs-targets: uv.lock
      trivy-scanners: vuln
      run-trivy-iac: true
      trivy-iac-targets: scorer/Dockerfile
      trivy-iac-scanners: dockerfile
      run-trivy-image: true
      trivy-image-targets: build|scorer/Dockerfile|scorer
