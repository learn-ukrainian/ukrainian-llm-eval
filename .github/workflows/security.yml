name: Security
on:
  workflow_call:
permissions: {}
jobs:
  fleet-security:
    name: Fleet security
    uses: learn-ukrainian/machinery/.github/workflows/fleet-security.yml@eb5547a8e8b534e118ab8804b759c2a6f31f1905 # machinery PR #1104
    permissions:
      contents: read
    with:
      run-actionlint: true
      run-zizmor: true
      run-secret-scan: true
      secret-scan-required-extensions: .py,.yml
      run-trivy-fs: true
      trivy-fs-targets: uv.lock
      trivy-scanners: vuln
      run-trivy-iac: true
      trivy-iac-targets: scorer/Dockerfile
      trivy-iac-scanners: dockerfile
      run-trivy-image: true
      trivy-image-targets: build|scorer/Dockerfile|scorer
